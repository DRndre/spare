<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spare | Quanto ti resta?</title>
  <meta name="description" content="Spese del mese, resto in tasca e risparmi: sai sempre quanto ti resta.">
  <!-- Anteprima quando si condivide il link (WhatsApp, iMessage, Telegram…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spare">
  <meta property="og:title" content="Spare | Quanto ti resta?">
  <meta property="og:description" content="Spese del mese, resto in tasca e risparmi: sai sempre quanto ti resta.">
  <meta property="og:url" content="https://drndre.github.io/spare/">
  <meta property="og:image" content="https://drndre.github.io/spare/icons/anteprima.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo di Spare con lo slogan Quanto ti resta?">
  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spare">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Tema scelto a mano (salvato su questo dispositivo): lo applico subito, prima di disegnare la pagina
    try { var t = localStorage.getItem("spare-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="auth" hidden></div>

  <div class="wrap" id="app" hidden>
    <header class="top">
      <h1 id="brand"></h1>
      <div class="top-right">
        <div class="status" id="status" data-s="idle"><span class="dot"></span><span id="statusTxt">Caricamento…</span></div>
        <button class="icon-btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Apri menu">
          <svg class="hamb" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path class="l1" d="M3 5.5h14"/><path class="l2" d="M3 10h14"/><path class="l3" d="M3 14.5h14"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <div class="menu-who" id="who"></div>
          <button type="button" id="doGuida">Configurazione guidata</button>
          <button type="button" id="doCategorie">Categorie</button>
          <button type="button" id="doAiuto">Come funziona</button>
          <button type="button" id="doSicurezza">Sicurezza</button>
          <div class="menu-sep"></div>
          <div class="menu-tema"><span class="label">Tema</span><div class="seg" id="temaSeg" role="group" aria-label="Tema">
            <button type="button" data-t="auto">Automatico</button><button type="button" data-t="light">Chiaro</button><button type="button" data-t="dark">Scuro</button>
          </div></div>
          <div class="menu-sep"></div>
          <button type="button" id="doExport">Esporta backup</button>
          <button type="button" id="doImport">Importa backup</button>
          <button type="button" id="doLogout">Esci</button>
        </div>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Schermate">
      <button type="button" role="tab" data-v="riepilogo">Riepilogo</button>
      <button type="button" role="tab" data-v="mesi">Mesi</button>
      <button type="button" role="tab" data-v="deposito">Deposito</button>
      <button type="button" role="tab" data-v="modello">Modello</button>
    </nav>
    <main id="view"></main>
    <footer>Importi mensili. Le spese ogni 2, 4 o 6 mesi vanno divise sui mesi.</footer>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
