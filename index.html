<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spare | Mesi</title>
  <meta name="description" content="Spese mensili, resto in tasca e conto deposito mese per mese.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spare">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth" hidden></div>

  <div class="wrap" id="app" hidden>
    <header class="top">
      <h1 id="brand"></h1>
      <div class="top-right">
        <div class="status" id="status" data-s="idle"><span class="dot"></span><span id="statusTxt">Caricamento…</span></div>
        <button class="icon-btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="16" cy="10" r="1.6" fill="currentColor"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <div class="menu-who" id="who"></div>
          <button type="button" id="doExport">Esporta backup</button>
          <button type="button" id="doImport">Importa backup</button>
          <button type="button" id="doLogout">Esci</button>
        </div>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Schermate">
      <button type="button" role="tab" data-v="mesi">Mesi</button>
      <button type="button" role="tab" data-v="deposito">Deposito</button>
      <button type="button" role="tab" data-v="modello">Modello</button>
    </nav>
    <main id="view"></main>
    <footer>Importi mensili. Le spese ogni 2, 4 o 6 mesi vanno divise sui mesi.</footer>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
